name: Build Plugin

# Builds the installable plugin zip (build/distributions/swttch-<version>.zip) on
# every push and on demand, and attaches it to the run as an artifact.
# `gradlew buildPlugin` does the whole job: it installs the backend and webview
# dependencies with pnpm, builds both, and packs them into the plugin.

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The version backend/ and webview/ declare in "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Locate plugin zip
        id: extract
        run: |
          ZIP_FILE=$(ls build/distributions/*.zip | head -n 1)
          echo "zip-file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.extract.outputs.zip-file }}
          if-no-files-found: error
          archive: false
